name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for accurate blame / new-code detection

      - name: Build and test
        run: swift test --enable-code-coverage

      - name: Export coverage
        run: |
          xcrun llvm-cov show \
            .build/debug/swift-guardianPackageTests.xctest/Contents/MacOS/swift-guardianPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            Sources > coverage.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
